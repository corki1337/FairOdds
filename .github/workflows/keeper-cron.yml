name: Keeper Cron Crank

on:
  schedule:
    # Run every 2 minutes (best-effort; GitHub may delay on free tier)
    - cron: '*/2 * * * *'
  workflow_dispatch:
    inputs:
      manual_trigger:
        description: 'Run keeper crank manually'
        required: false
        default: 'true'

jobs:
  keeper-crank:
    name: Ping Keeper Crank Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Keeper Cron Route
        env:
          DEPLOYED_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DEPLOYED_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skipping: set GitHub secrets NEXT_PUBLIC_APP_URL and CRON_SECRET"
            exit 0
          fi
          echo "Pinging keeper cron at $DEPLOYED_URL/api/cron/keeper"
          curl -sS -f -X GET \
            "$DEPLOYED_URL/api/cron/keeper?limit=10&timeout=50000" \
            -H "Authorization: Bearer $CRON_SECRET"
