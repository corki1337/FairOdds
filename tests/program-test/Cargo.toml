[package]
name = "aichain-program-test"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone so solana-program-test's dependency tree never touches the SBF workspace lockfile.
[workspace]

[lib]
path = "lib.rs"

[dependencies]

[dev-dependencies]
aichain = { path = "../../programs/aichain", features = ["no-entrypoint"] }
yield-park = { path = "../../programs/yield_park", features = ["no-entrypoint"] }
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program-test = "~1.18"
solana-sdk = "~1.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "integration"
path = "integration.rs"
